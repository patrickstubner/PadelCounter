<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Padel Counter zählt Games offline auf diesem Gerät. Kein Konto, kein Server."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'none'; upgrade-insecure-requests"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Padel" />
    <title>Padel Counter</title>
    <link rel="manifest" href="<%= assetPrefix %>/manifest.webmanifest" />
    <link rel="icon" href="<%= assetPrefix %>/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="<%= assetPrefix %>/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="<%= assetPrefix %>/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript">Padel Counter braucht JavaScript. Danach läuft die App offline und speichert den Spielstand nur auf diesem Gerät.</p>
    </noscript>
  </body>
</html>
