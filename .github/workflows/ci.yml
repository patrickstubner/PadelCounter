name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-running an old workflow_dispatch run is the deliberate rollback path.
  # Only users with write access can dispatch or re-run it, and only while that
  # run's Pages artifact still exists (1 day). This trigger has no inputs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check build output
        run: npm run verify-build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  upload:
    name: Upload Pages artifact
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: npm run verify-build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: upload
    if: needs.upload.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm this commit is still main
        id: head
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch; deploying this run's artifact."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          if ! listing="$(git ls-remote "$remote" refs/heads/main)"; then
            echo "::error::Could not read the head of main from ${remote}."
            exit 1
          fi
          head="$(printf '%s\n' "$listing" | awk 'NR==1 { print $1 }')"
          if [ -z "$head" ]; then
            echo "::error::Could not read the head of main from ${remote}."
            exit 1
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping deploy of ${GITHUB_SHA} because main is now ${head}."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Deploying ${GITHUB_SHA}, which is still the head of main."
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deployment
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
